name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  server-und-kern:
    name: Server + Sync-Kern (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            server -> target
            client -> target
      - name: Server bauen
        working-directory: server
        run: cargo build --release
      - name: Server-API-Tests
        working-directory: server
        run: cargo test --release && ./tests/api_test.sh
      - name: Sync-Kern-Tests (gegen echten Server)
        working-directory: client
        run: cargo test -p dropcraft-core

  windows:
    name: Windows-App ${{ matrix.variant }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: standard
            flags: ""
          - variant: cloud-files
            flags: "--features cloud-files"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client -> target
          key: ${{ matrix.variant }}
      - name: Bauen
        working-directory: client
        run: cargo build --release -p dropcraft-desktop ${{ matrix.flags }}
      - name: Tests
        working-directory: client
        run: cargo test --release -p dropcraft-desktop ${{ matrix.flags }}
      - uses: actions/upload-artifact@v4
        with:
          name: DropCraft-${{ matrix.variant }}
          path: client/target/release/DropCraft.exe

  macos:
    name: macOS-App
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client -> target
      - name: App-Bundle bauen
        run: bash client/desktop/macos/bundle.sh
      - name: Tests
        working-directory: client
        run: cargo test --release -p dropcraft-desktop
      - name: Zippen
        run: ditto -c -k --keepParent client/target/release/DropCraft.app DropCraft-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: DropCraft-macOS
          path: DropCraft-macOS.zip

  ios:
    name: iOS-App
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Xcode-Projekt erzeugen
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Bauen (unsigniert)
        working-directory: ios
        run: |
          xcodebuild -project DropCraft.xcodeproj -scheme DropCraft -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -n 60
          test -d build/Build/Products/Release-iphoneos/DropCraft.app
      - name: IPA packen (für SideStore/AltStore/Sideloadly)
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/DropCraft.app Payload/
          zip -qry DropCraft.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: DropCraft-iOS
          path: ios/DropCraft.ipa

  # Nach jedem grünen Lauf auf main: Release „latest“ mit den fertigen Apps aktualisieren.
  release:
    name: Release „Neuester Stand“
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [server-und-kern, windows, macos, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-latest
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: Dateien umbenennen
        run: |
          mkdir out
          cp art/DropCraft-cloud-files/DropCraft.exe out/DropCraft-Windows.exe
          cp art/DropCraft-standard/DropCraft.exe out/DropCraft-Windows-ohne-Cloud-Dateien.exe
          cp art/DropCraft-macOS/DropCraft-macOS.zip out/DropCraft-macOS.zip
          cp art/DropCraft-iOS/DropCraft.ipa out/DropCraft-iOS.ipa
          ls -la out
      - name: Release aktualisieren
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=$(git rev-parse --short HEAD)
          MSG=$(git log -1 --pretty=%s)
          NOTES="Automatisch gebaut aus \`$SHA\` ($(date -u +'%d.%m.%Y %H:%M') UTC): $MSG

          - **DropCraft-Windows.exe**: Windows-App mit Dateien bei Bedarf (empfohlen)
          - **DropCraft-Windows-ohne-Cloud-Dateien.exe**: lädt immer alle Dateien
          - **DropCraft-macOS.zip**: Mac-App (beim ersten Start Rechtsklick → Öffnen)
          - **DropCraft-iOS.ipa**: unsigniert, für SideStore/AltStore/Sideloadly"
          git tag -f latest
          git push -f origin latest
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --title "Neuester Stand ($SHA)" --notes "$NOTES" --latest
          else
            gh release create latest --title "Neuester Stand ($SHA)" --notes "$NOTES" --latest
          fi
          gh release upload latest out/* --clobber
