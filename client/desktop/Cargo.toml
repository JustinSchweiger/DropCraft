[package]
name = "dropcraft-desktop"
version = "0.1.0"
edition = "2021"

build = "build.rs"

[[bin]]
name = "DropCraft"
path = "src/main.rs"

[dependencies]
dropcraft-core = { path = "../core" }
eframe = "0.37"
egui = "0.37"
tray-icon = "0.26"
rfd = "0.18"
notify = "8"
dirs = "7"
gethostname = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
raw-window-handle = "0.6"
log = "0.4"

arboard = { version = "3", default-features = false }
notify-rust = "4"

[features]
# Platzhalter-Dateien, Status-Spalte im Explorer, „Immer auf diesem Gerät behalten“
cloud-files = ["dep:cloud-filter", "dep:nt-time"]

[build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_Storage_EnhancedStorage", "Win32_Storage_FileSystem", "Win32_Storage_Packaging_Appx", "Win32_Security_Cryptography"] }
cloud-filter = { version = "0.0.7", optional = true }
nt-time = { version = "0.15", optional = true }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_Graphics_Dwm", "Win32_UI_HiDpi"] }
winreg = "0.55"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
dispatch = "0.2"
