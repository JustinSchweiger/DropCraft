[package]
name = "dropcraft-desktop"
version = "0.1.0"
edition = "2021"

build = "build.rs"

[[bin]]
name = "DropCraft"
path = "src/main.rs"

[dependencies]
dropcraft-core = { path = "../core" }
eframe = "0.37"
egui = "0.37"
tray-icon = "0.26"
rfd = "0.18"
notify = "8"
dirs = "7"
gethostname = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
raw-window-handle = "0.6"
log = "0.4"

arboard = { version = "3", default-features = false }

[features]
# Platzhalter-Dateien, Status-Spalte im Explorer, „Immer auf diesem Gerät behalten“
cloud-files = ["dep:cloud-filter", "dep:nt-time"]

[build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
cloud-filter = { version = "0.0.7", optional = true }
nt-time = { version = "0.15", optional = true }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_Graphics_Dwm"] }
winreg = "0.55"
