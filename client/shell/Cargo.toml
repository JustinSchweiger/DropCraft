[package]
name = "dropcraft-shell"
version = "0.1.0"
edition = "2021"
description = "Windows-11-Kontextmenü „DropCraft“ (IExplorerCommand), wird in DropCraft.exe eingebettet"

[lib]
name = "dropcraft_shell"
crate-type = ["cdylib"]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_SystemServices", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }
windows-core = "0.62"
serde_json = "1"
