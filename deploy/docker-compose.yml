services:
  dropcraft:
    build: ../server
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
    expose:
      - "8080"

  caddy:
    image: caddy:2
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - dropcraft

volumes:
  caddy_data:
  caddy_config:
